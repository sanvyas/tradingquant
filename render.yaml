# Free dashboard only. Jobs run in GitHub Actions; the database is a separate free Postgres.
services:
  - type: web
    name: tq-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nsequant.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: DATABASE_URL, sync: false}
      - {key: DASH_PASSWORD, sync: false}
